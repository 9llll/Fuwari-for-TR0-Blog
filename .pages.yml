# Pages CMS 配置（https://app.pagescms.org/）
# 仓库根目录放这个文件，Pages CMS 会自动识别。
# 改动会直接以 commit 形式提交到 GitHub，由部署平台自动触发构建。

# ---------- 媒体库：文章图片 ----------
# 注意：Pages CMS 的媒体目录是固定路径，不支持按文章自动分子文件夹；
# 统一存到 src/content/posts/images，上传时会自动把文件名转成 slug 避免互相覆盖。
# output 写相对路径 images/，正文里生成 ![](images/xxx.jpg)，
# 主题会按「文章同级目录」解析，构建后自动转成 /_astro/... 优化图。
media:
  - name: post-images
    label: 文章图片
    input: src/content/posts/images
    output: images
    categories: [image]
    rename: safe

  - name: site-images
    label: 站点图片（banner / 头像 / favicon）
    input: public/images/site
    output: /images/site
    categories: [image]
    rename: safe

# ---------- 内容：文章 ----------
content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    # 新建文章时可以自定义文件名（如 yx-xxx.md），默认用标题
    filename:
      template: "{primary}.md"
      field: create
    exclude: ["images"]
    view:
      primary: title
      fields: [title, published, draft, pinned]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: description
        label: 简介（列表页摘要 / SEO 描述）
        type: text
        optional: true

      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updated
        label: 更新日期（留空则不显示）
        type: date
        optional: true
        options:
          format: yyyy-MM-dd

      - name: tags
        label: 标签（回车添加多个）
        type: string
        list: true
        optional: true

      - name: category
        label: 分类（回车添加多个）
        type: string
        list: true
        optional: true

      - name: image
        label: 封面图（留空 = 用正文第一张图，正文也没图则用随机封面 API）
        type: image
        optional: true

      - name: keywords
        label: 关键词（SEO，逗号分隔或逐条添加）
        type: string
        list: true
        optional: true

      - name: author
        label: 作者（留空用站点默认作者）
        type: string
        optional: true

      - name: series
        label: 系列名称（留空表示不属于任何系列）
        type: string
        optional: true

      - name: seriesOrder
        label: 系列内排序（数字越小越靠前）
        type: number
        optional: true
        default: 0

      - name: ogImage
        label: 社交分享图 OG Image（填完整 http(s) 链接）
        type: string
        optional: true

      - name: draft
        label: 草稿（开启后不在站点显示）
        type: boolean
        default: false

      - name: pinned
        label: 置顶
        type: boolean
        default: false

      - name: comment
        label: 开启评论
        type: boolean
        default: true

      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          # 默认是所见即所得编辑器；::btn / ::video / ::download / ::gallery
          # 这类自定义指令请点右上角切换到「Source / 源码」模式编辑
          switcher: true
          # 插入图片时存到上面的 post-images 媒体库
          media: post-images
          path: images
          rename: safe

  # ---------- 站点设置 ----------
  # 这些文件是站点配置的唯一数据源，src/config.ts 会读取它们并与内置默认值合并，
  # 所以某一项被清空时会自动回退默认值，不会把站点改崩。
  - name: site-settings
    label: 站点设置
    type: group
    items:
      - name: site-info
        label: 站点信息
        type: file
        path: src/data/site.json
        format: json
        fields:
          - name: title
            label: 站点名称（导航栏与标题）
            type: string
            required: true

          - name: description
            label: 站点简介（首页与 SEO 描述）
            type: text

          - name: keywords
            label: 站点关键词（SEO，逗号分隔）
            type: text

          - name: lang
            label: 站点语言
            type: select
            options:
              values:
                - zh_CN
                - zh_TW
                - en
                - ja
                - ko
                - es
                - th
                - vi
                - tr
                - id

          - name: themeColor
            label: 主题色
            type: object
            fields:
              - name: hue
                label: 色相（0-360）
                type: number
              - name: fixed
                label: 锁定色相（访客不可调）
                type: boolean

          - name: banner
            label: 顶部横幅
            type: object
            fields:
              - name: enable
                label: 显示横幅
                type: boolean
              - name: src
                label: 横幅图片
                type: image
                options:
                  media: site-images
              - name: position
                label: 取景位置
                type: select
                options:
                  values: [top, center, bottom]
              - name: credit
                label: 版权信息
                type: object
                fields:
                  - name: enable
                    label: 显示版权
                    type: boolean
                  - name: text
                    label: 版权文字
                    type: string
                  - name: url
                    label: 版权链接
                    type: string

          - name: toc
            label: 文章目录
            type: object
            fields:
              - name: enable
                label: 显示目录
                type: boolean
              - name: depth
                label: 目录层级（1-3）
                type: number

          - name: favicon
            label: 站点图标
            type: object
            list: true
            fields:
              - name: src
                label: 图标文件
                type: image
                options:
                  media: site-images
              - name: theme
                label: 主题
                type: select
                options:
                  values: [light, dark]
              - name: sizes
                label: 尺寸
                type: string

          - name: license
            label: 文章许可证
            type: object
            fields:
              - name: enable
                label: 显示许可证
                type: boolean
              - name: name
                label: 许可证名称
                type: string
              - name: url
                label: 许可证链接
                type: string

          - name: codeTheme
            label: 代码块主题
            type: select
            options:
              values:
                - github-dark
                - github-dark-dimmed
                - vitesse-dark
                - material-theme-palenight

      - name: nav-links
        label: 导航栏链接
        type: file
        path: src/data/nav.json
        format: json
        list: true
        fields:
          - name: name
            label: 名称
            type: string
          - name: url
            label: 链接
            type: string
            description: "首页填 /，归档填 /archive/，关于填 /about/，其余为自定义页面"
          - name: external
            label: 站外链接
            type: boolean

      - name: profile
        label: 侧边栏资料
        type: file
        path: src/data/profile.json
        format: json
        fields:
          - name: title
            label: 资料卡标题
            type: string
          - name: avatar
            label: 头像
            type: image
            options:
              media: site-images
          - name: name
            label: 昵称
            type: string
          - name: bio
            label: 个性签名
            type: text
          - name: icp
            label: ICP 备案号
            type: string
          - name: links
            label: 社交链接
            type: object
            list: true
            fields:
              - name: name
                label: 名称
                type: string
              - name: icon
                label: 图标（Iconify 名称，如 fa6-brands:github）
                type: string
              - name: url
                label: 链接
                type: string

      - name: friends
        label: 友情链接
        type: file
        path: src/data/friends.json
        format: json
        list: true
        fields:
          - name: name
            label: 站点名称
            type: string
          - name: url
            label: 站点地址
            type: string
          - name: avatar
            label: 头像地址
            type: string
          - name: description
            label: 站点简介
            type: text
